<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" fill="none">
  <!-- L3Harris Red Polyhedron / Wireframe Globe Emblem -->
  <g stroke="#E02424" stroke-width="1.6" fill="none" transform="translate(4, 5)">
    <!-- Hexagonal Outer Ring -->
    <polygon points="20,1 36.5,10.5 36.5,29.5 20,39 3.5,29.5 3.5,10.5" stroke="#E02424" fill="rgba(224, 36, 36, 0.04)" />
    <!-- Triangular / Geometric Facets -->
    <polygon points="20,10 30,16 30,28 20,34 10,28 10,16" stroke="#E02424" />
    <line x1="20" y1="1" x2="20" y2="10" />
    <line x1="36.5" y1="10.5" x2="30" y2="16" />
    <line x1="36.5" y1="29.5" x2="30" y2="28" />
    <line x1="20" y1="39" x2="20" y2="34" />
    <line x1="3.5" y1="29.5" x2="10" y2="28" />
    <line x1="3.5" y1="10.5" x2="10" y2="16" />
    <line x1="20" y1="10" x2="30" y2="28" />
    <line x1="30" y1="16" x2="20" y2="34" />
    <line x1="30" y1="28" x2="10" y2="28" />
    <line x1="20" y1="34" x2="10" y2="16" />
    <line x1="10" y1="28" x2="20" y2="10" />
    <line x1="10" y1="16" x2="30" y2="16" />
  </g>
  <!-- L3HARRIS Wordmark -->
  <text x="56" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="23" font-weight="900" fill="#111827" letter-spacing="-0.02em">L3HARRIS</text>
  <text x="180" y="20" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8" font-weight="700" fill="#6B7280">TM</text>
</svg>

